vo=gpu-next
hwdec=videotoolbox
screen=0
#loop-playlist
fs
screenshot-template=mpv-shot-%tY%tm%td-%F-%n
# af=lavfi=[dynaudnorm=f=75:g=25:p=0.55]   # peak-based, within-file only
af=lavfi=[loudnorm=I=-16:TP=-1.5:LRA=11]
#playlist-start=0
shuffle=yes
force-seekable=yes
sub-auto=fuzzy
slang=eng,en
# Use our vendored scripts/stats.lua (patched to show full path) instead of the built-in stats overlay.
load-stats-overlay=no

msg-level=audio=error
